<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qroom | ระบบจองห้องอัจฉริยะ</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Firebase SDK (เชื่อมต่อฐานข้อมูลออนไลน์) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #4318ff;
            --primary-hover: #3311db;
            --text-dark: #1b2559;
            --text-muted: #68769f;
            --danger: #ff5252;
            --success: #10b981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Prompt', sans-serif; }

        body {
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            color: var(--text-dark);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .shape {
            position: absolute; filter: blur(80px); z-index: -1; border-radius: 50%;
            animation: float 10s infinite ease-in-out alternate;
        }
        .shape-1 { width: 300px; height: 300px; background: #ff9a9e; top: -100px; left: -100px; }
        .shape-2 { width: 350px; height: 350px; background: #a18cd1; bottom: -150px; right: -100px; animation-delay: -5s; }
        .shape-3 { width: 250px; height: 250px; background: #fbc2eb; bottom: 20%; left: 10%; animation-duration: 15s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        .navbar {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            position: sticky; top: 0; z-index: 100;
        }

        .nav-brand { font-size: 1.4rem; font-weight: 600; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .nav-profile { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 35px; height: 35px; background: linear-gradient(135deg, var(--primary), #868CFF); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 15px 40px; display: grid; grid-template-columns: 380px 1fr; gap: 20px; }

        .card { border-radius: 20px; overflow: hidden; margin-bottom: 20px; }
        .card-header { padding: 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.6); }
        .card-header h2 { font-size: 1.2rem; }
        .card-header p { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }

        form { padding: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 6px; }
        .required { color: var(--danger); }

        .input-with-icon { position: relative; }
        .input-with-icon i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        input, select {
            width: 100%; padding: 12px 15px 12px 42px;
            border: 2px solid rgba(255, 255, 255, 0.8); border-radius: 12px;
            font-size: 0.9rem; outline: none; background: rgba(255, 255, 255, 0.5); color: var(--text-dark);
            transition: all 0.3s;
        }

        input:focus, select:focus { background: rgba(255, 255, 255, 0.9); border-color: var(--primary); }

        .btn-submit {
            width: 100%; padding: 14px; background: linear-gradient(135deg, var(--primary) 0%, #868CFF 100%);
            color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer;
            margin-top: 10px; box-shadow: 0 8px 15px rgba(67, 24, 255, 0.25);
        }

        .filter-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(255, 255, 255, 0.4); border-bottom: 1px solid rgba(255, 255, 255, 0.6); flex-wrap: wrap; gap: 10px; }
        .filter-group { display: flex; align-items: center; gap: 8px; }
        .filter-group input[type="date"] { padding: 6px 10px; width: auto; }
        .filter-buttons { display: flex; gap: 8px; }

        .btn-filter-primary, .btn-filter-secondary { padding: 6px 12px; border-radius: 8px; border: none; font-size: 0.8rem; font-weight: 500; cursor: pointer; }
        .btn-filter-primary { background-color: var(--primary); color: white; }
        .btn-filter-secondary { background-color: rgba(67, 24, 255, 0.1); color: var(--primary); }

        .table-responsive { overflow-x: auto; padding: 10px; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        th { color: var(--text-muted); font-size: 0.85rem; padding: 15px; text-align: left; }
        td { padding: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.5); vertical-align: middle; }

        tr.past-booking { opacity: 0.65; background: rgba(0, 0, 0, 0.02); }
        .time-badge { display: block; font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
        .room-badge { background: rgba(67, 24, 255, 0.1); color: var(--primary); padding: 6px 12px; border-radius: 15px; font-size: 0.85rem; font-weight: 600; display: inline-block; }
        .status-badge-done { background: #e2e8f0; color: #475569; padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; margin-right: 5px; }

        .btn-delete { background: rgba(255, 82, 82, 0.1); color: var(--danger); border: 1px solid rgba(255, 82, 82, 0.3); padding: 6px 10px; border-radius: 8px; cursor: pointer; }

        .hidden { display: none !important; }
        .auth-container { display: flex; justify-content: center; align-items: center; min-height: 70vh; padding: 15px; }
        .auth-card { width: 100%; max-width: 420px; }
        .auth-header { padding: 25px 20px 10px; text-align: center; }
        .auth-header h2 { color: var(--primary); margin-bottom: 15px; font-size: 1.3rem; }
        .auth-tabs { display: flex; background: rgba(255, 255, 255, 0.5); border-radius: 12px; padding: 4px; }
        .tab-btn { flex: 1; padding: 8px; border: none; background: transparent; border-radius: 8px; font-size: 0.9rem; color: var(--text-muted); cursor: pointer; }
        .tab-btn.active { background: white; color: var(--primary); font-weight: 600; }
        .btn-logout { background: rgba(255, 82, 82, 0.15); color: var(--danger); border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; }
        .no-data { text-align: center; padding: 40px !important; color: var(--text-muted); }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
            .filter-bar { flex-direction: column; align-items: stretch; }
        }

        /* =========================================
           ✨ แอนิเมชันและเอฟเฟกต์เพิ่มเติม (Animations)
           ========================================= */

        /* เอฟเฟกต์สลับหน้าแบบนุ่มนวล */
        #loginForm, #registerForm {
            animation: fadeSwitch 0.4s ease-out forwards;
        }

        @keyframes fadeSwitch {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* เอฟเฟกต์โฮเวอร์ (Hover) สำหรับการ์ดและปุ่ม */
        .card {
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(31, 38, 135, 0.2);
        }

        .btn-submit {
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(67, 24, 255, 0.4);
        }

        .btn-submit:active {
            transform: translateY(1px);
            box-shadow: 0 5px 10px rgba(67, 24, 255, 0.3);
        }

        /* แอนิเมชันสำหรับโหลดข้อมูลในตาราง */
        .fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
            opacity: 0;
            transform: translateY(15px);
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* ทำให้ช่อง Input โฟกัสแล้วดูสมูท */
        input, select {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
    </style>
</head>
<body>
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>

    <nav class="navbar glass-panel">
        <div class="nav-brand">
            <i class="fa-solid fa-building-columns"></i> 
            <span>Qroom</span>
        </div>
        <div class="nav-profile hidden" id="userProfile">
            <div class="avatar"><i class="fa-solid fa-user-astronaut"></i></div>
            <span id="welcomeText" style="font-size: 0.9rem;">ยินดีต้อนรับ</span>
            <button id="btnLogout" class="btn-logout" title="ออกจากระบบ">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </div>
    </nav>

    <!-- 🔐 หน้า Login & Register -->
    <main id="authSection" class="auth-container">
        <div class="card glass-panel auth-card">
            <div class="auth-header">
                <h2 id="authTitle"><i class="fa-solid fa-fingerprint"></i> เข้าสู่ระบบ Qroom</h2>
                <div class="auth-tabs">
                    <button id="tabLogin" class="tab-btn active">เข้าสู่ระบบ</button>
                    <button id="tabRegister" class="tab-btn">สมัครสมาชิก</button>
                </div>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="loginUsername" placeholder="กรอก Username" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="กรอกรหัสผ่าน" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> เข้าสู่ระบบ
                </button>
            </form>

            <form id="registerForm" class="hidden">
                <div class="form-group">
                    <label>ชื่อ-นามสกุล (แสดงตอนจอง)</label>
                    <div class="input-with-icon">
                        <i class="fa-regular fa-id-card"></i>
                        <input type="text" id="regName" placeholder="เช่น ด.ช.รักเรียน ดีเยี่ยม" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-user-plus"></i>
                        <input type="text" id="regUsername" placeholder="ตั้ง Username" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="regPassword" placeholder="ตั้งรหัสผ่าน" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-user-check"></i> สมัครสมาชิก
                </button>
            </form>
        </div>
    </main>

    <!-- 🏫 ระบบจองห้อง -->
    <main id="appSection" class="container hidden">
        <section class="card glass-panel">
            <div class="card-header">
                <h2><i class="fa-solid fa-rocket"></i> สร้างการจองใหม่</h2>
                <p>เลือกอาคารและห้องที่ต้องการใช้งาน</p>
            </div>
            
            <form id="bookingForm">
                <div class="form-group">
                    <label for="name">ชื่อผู้จอง <span class="required">*</span></label>
                    <div class="input-with-icon">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" id="name" readonly style="background: rgba(255,255,255,0.2); cursor: not-allowed;">
                    </div>
                </div>

                <div class="form-group">
                    <label for="room">เลือกสถานที่ <span class="required">*</span></label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-map-location-dot"></i>
                        <select id="room" required>
                            <option value="" disabled selected>-- กำลังโหลดข้อมูลห้อง... --</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="date">วันที่ใช้งาน <span class="required">*</span></label>
                    <div class="input-with-icon">
                        <i class="fa-regular fa-calendar"></i>
                        <input type="date" id="date" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="startTime">เวลาเริ่ม <span class="required">*</span></label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-hourglass-start"></i>
                            <input type="time" id="startTime" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="endTime">เวลาสิ้นสุด <span class="required">*</span></label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-hourglass-end"></i>
                            <input type="time" id="endTime" required>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-check-circle"></i> ยืนยันการจองห้อง
                </button>
            </form>
        </section>

        <section class="card glass-panel">
            <div class="card-header">
                <h2><i class="fa-solid fa-clipboard-list"></i> ตารางและคิวการใช้ห้อง</h2>
                <p>ดูคิวประจำวันหรือย้อนหลังได้สูงสุด 1 เดือน</p>
            </div>
            
            <div class="filter-bar">
                <div class="filter-group">
                    <label for="filterDate"><i class="fa-solid fa-filter"></i> เลือกวันที่:</label>
                    <input type="date" id="filterDate">
                </div>
                <div class="filter-buttons">
                    <button type="button" id="btnToday" class="btn-filter-secondary">คิววันนี้</button>
                    <button type="button" id="btnClearFilter" class="btn-filter-primary">ทั้งหมด</button>
                </div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>วัน/เวลา</th>
                            <th>ห้อง</th>
                            <th>ผู้จอง</th>
                            <th>จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="bookingTableBody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        // 🚨 นำข้อความ firebaseConfig จากเว็บ Firebase มาวางตรงนี้แทนที่ครับ
        const firebaseConfig = {
            apiKey: "AIzaSyDoKhnGQcXx8JDAHSWNygWWhHE8FDqvAQE",
            authDomain: "qroom-b3a32.firebaseapp.com",
            projectId: "qroom-b3a32",
            storageBucket: "qroom-b3a32.firebasestorage.app",
            messagingSenderId: "132074385246",
            appId: "1:132074385246:web:359a8e0e544996d7fba9cf"
        };

        // เริ่มต้นใช้งาน Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const authSection = document.getElementById('authSection');
        const appSection = document.getElementById('appSection');
        const userProfile = document.getElementById('userProfile');
        const welcomeText = document.getElementById('welcomeText');
        const btnLogout = document.getElementById('btnLogout');

        const tabLogin = document.getElementById('tabLogin');
        const tabRegister = document.getElementById('tabRegister');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const authTitle = document.getElementById('authTitle');

        const bookingForm = document.getElementById('bookingForm');
        const bookingTableBody = document.getElementById('bookingTableBody');
        const roomSelect = document.getElementById('room');
        const filterDateInput = document.getElementById('filterDate');
        const btnToday = document.getElementById('btnToday');
        const btnClearFilter = document.getElementById('btnClearFilter');

        let currentUser = null;
        let allBookings = [];

        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            setupDateLimits();
            generateRoomOptions();
        });

        tabLogin.addEventListener('click', () => {
            tabLogin.classList.add('active'); tabRegister.classList.remove('active');
            loginForm.classList.remove('hidden'); registerForm.classList.add('hidden');
            authTitle.innerHTML = '<i class="fa-solid fa-fingerprint"></i> เข้าสู่ระบบ Qroom';
        });

        tabRegister.addEventListener('click', () => {
            tabRegister.classList.add('active'); tabLogin.classList.remove('active');
            registerForm.classList.remove('hidden'); loginForm.classList.add('hidden');
            authTitle.innerHTML = '<i class="fa-solid fa-user-plus"></i> สมัครสมาชิก Qroom';
        });

        // ระบบสมัครสมาชิกบันทึกลง Firebase
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;

            try {
                const userDoc = await db.collection('users').doc(username).get();
                if (userDoc.exists) {
                    Swal.fire({ icon: 'error', title: 'Username ซ้ำ', text: 'ชื่อผู้ใช้งานนี้ถูกสมัครไปแล้ว' });
                    return;
                }

                await db.collection('users').doc(username).set({ name, username, password });
                Swal.fire({ icon: 'success', title: 'สมัครสำเร็จ!', text: 'กรุณาล็อกอินเข้าใช้งาน', timer: 1500 });
                registerForm.reset();
                tabLogin.click();
            } catch (err) {
                Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: err.message });
            }
        });

        // ระบบเข้าสู่ระบบเช็คจาก Firebase
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            try {
                const userDoc = await db.collection('users').doc(username).get();
                if (userDoc.exists && userDoc.data().password === password) {
                    const userData = userDoc.data();
                    localStorage.setItem('qroom_session', JSON.stringify(userData));
                    checkAuth();
                } else {
                    Swal.fire({ icon: 'error', title: 'เข้าสู่ระบบไม่สำเร็จ', text: 'Username หรือ รหัสผ่านไม่ถูกต้อง' });
                }
            } catch (err) {
                Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: err.message });
            }
        });

        btnLogout.addEventListener('click', () => {
            localStorage.removeItem('qroom_session');
            checkAuth();
        });

        function checkAuth() {
            const session = localStorage.getItem('qroom_session');
            if (session) {
                currentUser = JSON.parse(session);
                authSection.classList.add('hidden');
                appSection.classList.remove('hidden');
                userProfile.classList.remove('hidden');
                welcomeText.textContent = currentUser.name;
                document.getElementById('name').value = currentUser.name;
                listenToBookings(); // ดึงคิวจองแบบ Real-time
            } else {
                currentUser = null;
                authSection.classList.remove('hidden');
                appSection.classList.add('hidden');
                userProfile.classList.add('hidden');
            }
        }

        // ฟังคิวจองจาก Firebase แบบ Real-time (ใครจองใหม่ หน้าจอจะเด้งทันทีทุกเครื่อง)
        function listenToBookings() {
            db.collection('bookings').onSnapshot(snapshot => {
                allBookings = [];
                snapshot.forEach(doc => {
                    allBookings.push({ id: doc.id, ...doc.data() });
                });
                allBookings.sort((a, b) => new Date(`${a.date}T${a.startTime}`) - new Date(`${b.date}T${b.startTime}`));
                displayBookings(filterDateInput.value);
            });
        }

        function setupDateLimits() {
            const todayStr = new Date().toISOString().split('T')[0];
            document.getElementById('date').setAttribute('min', todayStr);
            const past30Days = new Date(); past30Days.setDate(new Date().getDate() - 30);
            filterDateInput.setAttribute('min', past30Days.toISOString().split('T')[0]);
        }

        function generateRoomOptions() {
            roomSelect.innerHTML = '<option value="" disabled selected>-- เลือกสถานที่ --</option>';
            const libraryGroup = document.createElement('optgroup');
            libraryGroup.label = "📍 หอสมุด";
            ['ห้องโครงงาน', 'ห้องเวทีใหญ่'].forEach(room => {
                const opt = document.createElement('option');
                opt.value = `${room} (หอสมุด)`; opt.textContent = `📚 ${room}`;
                libraryGroup.appendChild(opt);
            });
            roomSelect.appendChild(libraryGroup);

            for (let floor = 1; floor <= 4; floor++) {
                const bg = document.createElement('optgroup');
                bg.label = `🏢 อาคาร 3 - ชั้น ${floor}`;
                for (let r = 2; r <= 8; r++) {
                    const opt = document.createElement('option');
                    opt.value = `ห้อง 3${floor}${r}`; opt.textContent = `🚪 ห้อง 3${floor}${r}`;
                    bg.appendChild(opt);
                }
                roomSelect.appendChild(bg);
            }
        }

        filterDateInput.addEventListener('change', () => displayBookings(filterDateInput.value));
        btnToday.addEventListener('click', () => {
            const t = new Date().toISOString().split('T')[0];
            filterDateInput.value = t; displayBookings(t);
        });
        btnClearFilter.addEventListener('click', () => { filterDateInput.value = ''; displayBookings(); });

        bookingForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const date = document.getElementById('date').value;
            const room = document.getElementById('room').value;
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;

            if (startTime >= endTime) {
                Swal.fire({ icon: 'error', title: 'เวลาไม่ถูกต้อง', text: 'เวลาสิ้นสุดต้องมาหลังเวลาเริ่ม!' });
                return;
            }
            if (isBookingConflicted(room, date, startTime, endTime)) {
                Swal.fire({ icon: 'warning', title: 'ห้องถูกจองแล้ว', text: 'เวลานี้มีผู้ใช้งานแล้ว' });
                return;
            }

            try {
                await db.collection('bookings').add({
                    username: currentUser.username,
                    name: currentUser.name,
                    date, room, startTime, endTime,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                document.getElementById('date').value = ''; document.getElementById('room').value = '';
                document.getElementById('startTime').value = ''; document.getElementById('endTime').value = '';
                Swal.fire({ icon: 'success', title: 'จองสำเร็จ!', timer: 1500, showConfirmButton: false });
            } catch (err) {
                Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: err.message });
            }
        });

        function isBookingConflicted(r, d, s, e) {
            return allBookings.some(b => b.room === r && b.date === d && (s < b.endTime && e > b.startTime));
        }

        function deleteBooking(id) {
            Swal.fire({ title: 'ยกเลิกการจอง?', icon: 'warning', showCancelButton: true, confirmButtonText: 'ยกเลิก', cancelButtonText: 'ปิด' })
            .then(async (res) => {
                if (res.isConfirmed) {
                    await db.collection('bookings').doc(id).delete();
                    Swal.fire({ icon: 'success', title: 'ยกเลิกสำเร็จ', timer: 1200, showConfirmButton: false });
                }
            });
        }

        function displayBookings(filterDate = null) {
            let list = [...allBookings];
            bookingTableBody.innerHTML = '';
            const today = new Date(); today.setHours(0,0,0,0);
            const past30 = new Date(); past30.setDate(today.getDate() - 30); past30.setHours(0,0,0,0);

            list = list.filter(b => new Date(b.date) >= past30);
            if (filterDate) list = list.filter(b => b.date === filterDate);

            if (list.length === 0) {
                bookingTableBody.innerHTML = `<tr><td colspan="4" class="no-data"><i class="fa-solid fa-folder-open"></i> ไม่มีรายการจอง</td></tr>`;
                return;
            }

            // ✨ ปรับปรุงแอนิเมชันให้ตารางเด้งทีละบรรทัด (Staggered Animation)
            list.forEach((b, index) => {
                const row = document.createElement('tr');
                
                // เพิ่มคลาสแอนิเมชันและเวลาหน่วง (Delay)
                row.classList.add('fade-in-up');
                row.style.animationDelay = `${index * 0.08}s`;

                const bDate = new Date(b.date); bDate.setHours(0,0,0,0);
                const isPast = bDate < today;
                if (isPast) row.classList.add('past-booking');

                const fDate = bDate.toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short' });
                const canDelete = currentUser.username === b.username;
                const delBtn = canDelete ? `<button class="btn-delete" onclick="deleteBooking('${b.id}')"><i class="fa-solid fa-trash-can"></i></button>` : `<i class="fa-solid fa-lock" style="color:#aaa;"></i>`;

                row.innerHTML = `
                    <td><strong>${fDate}</strong><span class="time-badge">${b.startTime}-${b.endTime}</span></td>
                    <td><span class="room-badge">${b.room}</span></td>
                    <td><strong>${b.name}</strong></td>
                    <td>${isPast ? '<span class="status-badge-done">ผ่านไปแล้ว</span>' : ''}${delBtn}</td>
                `;
                bookingTableBody.appendChild(row);
            });
        }
    </script>
</body>
</html>
